name: Website block

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/**"
      - "docker/website.Dockerfile"
      - ".dockerignore"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website-block.yml"
  workflow_dispatch:

concurrency:
  group: website-block-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not ghcr.io/${{ github.repository }}: that is ZenSamClifford/framework-sandbox and
  # ghcr rejects uppercase in a repository path. zengenti/ui gets away with the
  # expression only because its org is already lowercase.
  IMAGE: ghcr.io/zensamclifford/framework-sandbox/website

jobs:
  deploy:
    name: Build and deploy website block
    # Deviation from the org-wide rule to use [self-hosted, linux]: this is a personal
    # repo with no access to the Zengenti self-hosted runner pool.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Replaces setup-node, pnpm setup and manual dependency caching.
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run -r test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/website.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # contensis/block-push@v1 cannot be used here. It interpolates the raw commit
      # message into the command string it hands to contensis/cli-action@v1, which
      # ends in `eval contensis $CONTENSIS_COMMAND` with the variable unquoted. Any
      # backtick, quote or newline in a commit message is therefore executed by the
      # shell: run 34456294182 died on `sh: eval: line 6: syntax error: unterminated
      # quoted string` after running the backticked words in its own commit message.
      #
      # So call cli-action directly and pass metadata that has been through a
      # sanitiser. Worth raising upstream: a commit message is attacker-controlled
      # input, and CONTENSIS_SHARED_SECRET is in that container's environment.
      - name: Sanitise commit metadata
        id: commit
        env:
          # Read via the environment, never interpolated into the script body.
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          # Subject line only, then strip everything a shell would interpret.
          FIRST=${SUBJECT%%$'\n'*}
          [ -n "$FIRST" ] || FIRST=$(git log -1 --pretty=%s)
          echo "message=${FIRST//[\`\"\'$\\]/}" >> "$GITHUB_OUTPUT"
          echo "datetime=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%ae)" >> "$GITHUB_OUTPUT"
          echo "committer=$(git log -1 --pretty=%ce)" >> "$GITHUB_OUTPUT"

      # `--release` registers and releases the version. It does not make it live;
      # that stays a manual CMS action.
      #
      # `--repository-url` takes `owner/repo`, not a URL. Under GITHUB_ACTIONS the CLI
      # prepends `https://github.com/` and appends `.git` itself (dist/commands/push.js),
      # so passing a full URL as block-push does yields a doubled scheme and dead commit
      # links in the CMS.
      - name: Push block to Contensis
        uses: contensis/cli-action@v1
        with:
          alias: prs
          project-id: tim
          client-id: ${{ secrets.CONTENSIS_CLIENT_ID }}
          shared-secret: ${{ secrets.CONTENSIS_SHARED_SECRET }}
          command: >-
            push block website
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.run_number }}
            ${{ github.ref_name }} --release
            --provider Github
            --repository-url ${{ github.repository }}
            --commit-id ${{ github.sha }}
            --commit-message "${{ steps.commit.outputs.message }}"
            --commit-datetime ${{ steps.commit.outputs.datetime }}
            --author-email ${{ steps.commit.outputs.author }}
            --committer-email ${{ steps.commit.outputs.committer }}
